<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030404">
  <title>3DCancha — Reproductor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#030404;
      --panel:#0b0e0f;
      --green:#9fbe18;
      --text:#f8f9f9;
      --muted:#9ca3a4;
      --line:#30383a;
      --red:#ef3f3f;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:#000;
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{min-height:100vh}
    img{display:block;max-width:100%}
    button{font:inherit;cursor:pointer}

    .page{
      width:min(100%,1440px);
      min-height:100vh;
      margin:0 auto;
      background:var(--bg);
      display:flex;
      flex-direction:column;
    }

    /* CABECERA */
    .header{
      min-height:82px;
      padding:8px 4.1%;
      display:flex;
      align-items:center;
      gap:16px;
      border-bottom:1px solid rgba(255,255,255,.05);
      position:relative;
      z-index:5;
    }

    .header-logo{
      width:300px;
      height:68px;
      object-fit:contain;
      object-position:left center;
      transform:scale(2.2);
      transform-origin:left center;
      position:relative;
      top:14px;
      pointer-events:none;
    }

    .header-spacer{flex:1}

    .platea{
      height:34px;
      padding:0 18px;
      border:1.5px solid var(--green);
      border-radius:24px;
      background:#080a0a;
      color:#fff;
      font-size:11px;
      font-weight:900;
      letter-spacing:.05em;
      display:flex;
      align-items:center;
      gap:9px;
    }

    .person{
      width:15px;
      height:15px;
      border:2px solid var(--green);
      border-radius:50%;
      position:relative;
    }

    .person::after{
      content:"";
      position:absolute;
      width:18px;
      height:8px;
      left:50%;
      top:12px;
      transform:translateX(-50%);
      border:2px solid var(--green);
      border-top:0;
      border-radius:0 0 12px 12px;
    }

    /* CONTENIDO */
    main{
      flex:1;
      padding:20px 5.4% 30px;
    }

    .back{
      display:inline-block;
      margin-bottom:18px;
      color:var(--green);
      text-decoration:none;
      font-size:15px;
      font-weight:900;
      letter-spacing:.025em;
    }

    /* REPRODUCTOR */
    .player{
      width:80%;
      margin:0 auto 22px;
    }

    .player-screen{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      overflow:hidden;
      background:#050505;
      border:2px solid var(--green);
      box-shadow:0 12px 35px rgba(0,0,0,.45);
    }

    .player-screen video{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      background:#050505;
    }

    .player-placeholder{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:#72797a;
      font-size:13px;
      letter-spacing:.08em;
      pointer-events:none;
    }

    .watermark{
      position:absolute;
      right:15px;
      bottom:52px;
      width:115px;
      height:auto;
      z-index:3;
      pointer-events:none;
      filter:drop-shadow(0 2px 5px rgba(0,0,0,.85));
    }

    .controls{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:42px;
      padding:0 14px;
      display:flex;
      align-items:center;
      gap:15px;
      background:rgba(0,0,0,.84);
      z-index:4;
    }

    .live{
      display:flex;
      align-items:center;
      gap:6px;
      color:#fff;
      font-size:11px;
      font-weight:900;
    }

    .live-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--red);
      box-shadow:0 0 8px rgba(239,63,63,.7);
    }

    .control-button{
      width:25px;
      height:30px;
      padding:0;
      border:0;
      background:transparent;
      color:#fff;
      display:grid;
      place-items:center;
      font-size:17px;
    }

    .fullscreen{margin-left:auto}

    /* FICHA */
    .match-card{
      width:80%;
      margin:0 auto;
      padding:19px 34px 15px;
      border:1px solid #343c3e;
      border-radius:14px;
      background:rgba(7,11,12,.96);
    }

    .match-title{
      margin:0 0 8px;
      text-align:center;
      font-family:Michroma,"Arial Black",Arial,sans-serif;
      font-size:clamp(17px,1.6vw,23px);
      line-height:1.2;
      font-weight:900;
      text-transform:uppercase;
    }

    .match-title .green{color:var(--green)}

    .status{
      margin:0 0 13px;
      text-align:center;
      color:var(--red);
      font-size:10px;
      font-weight:900;
      letter-spacing:.03em;
    }

    .status::before{
      content:"";
      display:inline-block;
      width:7px;
      height:7px;
      margin-right:7px;
      border-radius:50%;
      background:var(--red);
    }

    .teams{
      display:grid;
      grid-template-columns:1fr 72px 1fr;
      align-items:center;
      padding:4px 0 14px;
      text-align:center;
    }

    .team,
    .versus{
      font-family:Michroma,"Arial Black",Arial,sans-serif;
      font-weight:900;
      text-transform:uppercase;
    }

    .team{font-size:clamp(14px,1.35vw,20px)}
    .versus{color:var(--green);font-size:clamp(17px,1.6vw,23px)}

    .meta{
      padding-top:11px;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:7px 22px;
      color:var(--muted);
      font-size:13px;
    }

    .meta b{color:#fff}

    /* FOOTER */
    .footer{
      min-height:42px;
      padding:5px 4.1%;
      border-top:1px solid #262d2e;
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      gap:20px;
      color:#7d8687;
      font-size:8px;
    }

    .footer-left{display:flex;align-items:center;gap:3px}
    .footer-logo{width:75px;height:30px;object-fit:contain;object-position:left center}
    .contact{color:var(--green);font-size:11px;font-weight:900;text-decoration:none}
    .footer-right{display:flex;align-items:center;gap:15px;white-space:nowrap}
    .footer-right a{color:#a2aaab;text-decoration:none}

    /* MOBILE */
    @media (max-width:767px){
      .page{width:min(100%,460px)}

      .header{
        min-height:91px;
        padding:12px 14px 5px;
        gap:10px;
      }

      .header-logo{
        width:166px;
        height:78px;
        transform:none;
        top:0;
      }

      .platea{
        height:39px;
        padding:0 13px;
        font-size:11px;
      }

      .person{display:none}

      main{padding:18px 14px 22px}
      .back{margin:0 8px 16px;font-size:14px}

      .player{
        width:100%;
        margin-bottom:14px;
      }

      .player-screen{border-width:1px}
      .controls{height:38px;padding:0 10px;gap:12px}
      .live{font-size:10px}
      .watermark{width:78px;right:9px;bottom:44px}

      .match-card{
        width:100%;
        padding:15px 10px 12px;
      }

      .match-title{font-size:14px;margin-bottom:9px}
      .status{margin-bottom:10px}
      .teams{grid-template-columns:1fr 38px 1fr;padding-bottom:12px}
      .team{font-size:11px;line-height:1.25}
      .versus{font-size:13px}

      .meta{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:7px 12px;
        padding:10px 7px 0;
        font-size:10px;
      }

      .footer{
        padding:13px 14px 18px;
        display:flex;
        flex-direction:column;
        gap:7px;
        text-align:center;
        font-size:8px;
      }

      .footer-left{justify-content:center}
      .footer-right{justify-content:center;gap:7px;white-space:normal;flex-wrap:wrap}
    }

    @media (max-width:370px){
      .header-logo{width:150px}
      .platea{padding:0 10px;font-size:10px}
      .match-title{font-size:12px}
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="header">
      <img class="header-logo" src="3dcancha logo transparente aut.png" alt="3DCancha">
      <div class="header-spacer"></div>
      <button class="platea" type="button">
        <span class="person" aria-hidden="true"></span>
        MI PLATEA
      </button>
    </header>

    <main>
      <a class="back" href="index.html">‹ VOLVER A INICIO</a>

      <section class="player" aria-label="Transmisión del partido">
        <div class="player-screen" id="playerScreen">
          <!-- Más adelante, Cloudflare colocará aquí la dirección de la transmisión. -->
          <video id="livePlayer" playsinline preload="metadata"></video>
          <div class="player-placeholder" id="playerPlaceholder">TRANSMISIÓN EN VIVO</div>

          <img class="watermark" src="3dcancha logo transparente aut.png" alt="">

          <div class="controls">
            <span class="live"><span class="live-dot"></span>EN VIVO</span>
            <button class="control-button" id="playButton" type="button" aria-label="Reproducir">▶</button>
            <button class="control-button" id="volumeButton" type="button" aria-label="Silenciar">🔊</button>
            <button class="control-button fullscreen" id="fullscreenButton" type="button" aria-label="Pantalla completa">⛶</button>
          </div>
        </div>
      </section>

      <section class="match-card" aria-label="Ficha del partido seleccionado">
        <h1 class="match-title">
          FICHA DEL PARTIDO <span class="green">SELECCIONADO</span>
        </h1>

        <div class="status">DISPONIBLE</div>

        <div class="teams">
          <div class="team">EQUIPO LOCAL</div>
          <div class="versus">VS</div>
          <div class="team">EQUIPO VISITANTE</div>
        </div>

        <div class="meta">
          <span>Categoría: <b>2013</b></span>
          <span>Cancha: <b>Cancha 1</b></span>
          <span>Fecha: <b>Sábado 12/09</b></span>
          <span>Hora: <b>12:00 hs</b></span>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-left">
        <img class="footer-logo" src="3dcancha logo transparente aut.png" alt="3DCancha">
        <a class="contact" href="#">Contacto</a>
      </div>

      <div class="footer-right">
        <a href="#">Términos y condiciones</a>
        <a href="#">Política de privacidad</a>
        <span>© 2026 3DCancha. Todos los derechos reservados.</span>
      </div>
    </footer>
  </div>

  <script>
    const video = document.getElementById("livePlayer");
    const playerScreen = document.getElementById("playerScreen");
    const placeholder = document.getElementById("playerPlaceholder");
    const playButton = document.getElementById("playButton");
    const volumeButton = document.getElementById("volumeButton");
    const fullscreenButton = document.getElementById("fullscreenButton");

    function syncPlayButton(){
      playButton.textContent = video.paused ? "▶" : "❚❚";
      playButton.setAttribute("aria-label", video.paused ? "Reproducir" : "Pausar");
    }

    playButton.addEventListener("click", async function(){
      try{
        if(video.paused){
          await video.play();
        }else{
          video.pause();
        }
      }catch(error){
        /* El botón quedará listo aunque todavía no haya una transmisión conectada. */
      }
      syncPlayButton();
    });

    volumeButton.addEventListener("click", function(){
      video.muted = !video.muted;
      volumeButton.textContent = video.muted ? "🔇" : "🔊";
      volumeButton.setAttribute("aria-label", video.muted ? "Activar sonido" : "Silenciar");
    });

    fullscreenButton.addEventListener("click", async function(){
      try{
        if(!document.fullscreenElement){
          await playerScreen.requestFullscreen();
        }else{
          await document.exitFullscreen();
        }
      }catch(error){
        /* Algunos navegadores móviles administran pantalla completa por separado. */
      }
    });

    video.addEventListener("play", syncPlayButton);
    video.addEventListener("pause", syncPlayButton);
    video.addEventListener("loadeddata", function(){
      placeholder.hidden = true;
    });
  </script>
</body>
</html>
