<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ficha del partido | 3DCancha</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --verde:#96c11f;
  --negro:#050706;
  --panel:#0b1210;
  --panel2:#101816;
  --linea:#26352e;
  --blanco:#ffffff;
  --gris:#aeb8b3;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:inherit;
}

/* =========================
   ESTRUCTURA GENERAL
========================= */

.page{
  width:100%;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 10%,rgba(150,193,31,.08),transparent 35%),
    linear-gradient(180deg,#07100c 0%,#020403 100%);
}

.shell{
  width:min(1180px,94%);
  margin:auto;
}

/* =========================
   HEADER
========================= */

.header{
  height:82px;
  border-bottom:1px solid #1b2822;
  background:rgba(0,0,0,.88);
}

.header-inner{
  height:100%;
  display:flex;
  align-items:center;
  gap:34px;
}

.logo{
  width:145px;
  height:auto;
  display:block;
}

.nav{
  display:flex;
  align-items:center;
  gap:22px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
}

.nav a{
  opacity:.82;
}

.nav a:hover{
  color:var(--verde);
}

.header-search{
  margin-left:auto;
  width:260px;
  height:36px;
  border:1px solid #35463e;
  border-radius:4px;
  display:flex;
  align-items:center;
  padding:0 12px;
  color:#8e9a94;
  font-size:11px;
}

.platea{
  height:36px;
  padding:0 15px;
  border:1px solid var(--verde);
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--verde);
  font-size:11px;
  font-weight:900;
}

.slogan{
  text-align:right;
  font-size:10px;
  font-weight:900;
  line-height:1.15;
}

.slogan span{
  display:block;
  color:var(--verde);
}

/* =========================
   CONTENIDO
========================= */

.main{
  padding:24px 0 35px;
}

.back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#d7dedb;
  font-size:11px;
  font-weight:800;
  margin-bottom:22px;
}

.back:hover{
  color:var(--verde);
}

.match-top{
  border:1px solid var(--linea);
  background:rgba(8,14,12,.88);
  border-radius:6px;
  overflow:hidden;
}

.match-meta{
  min-height:42px;
  border-bottom:1px solid var(--linea);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  font-size:10px;
  color:#c1cbc6;
  text-transform:uppercase;
}

.match-meta span{
  padding-right:22px;
  border-right:1px solid #344139;
}

.match-meta span:last-child{
  border-right:0;
  padding-right:0;
}

.teams{
  min-height:155px;
  display:grid;
  grid-template-columns:1fr 280px 1fr;
  align-items:center;
  padding:20px 55px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.45),rgba(12,28,20,.45),rgba(0,0,0,.45));
}

.team{
  display:flex;
  align-items:center;
  gap:18px;
}

.team.right{
  justify-content:flex-end;
  text-align:right;
}

.badge{
  width:74px;
  height:74px;
  border-radius:50%;
  border:3px solid #dce3df;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#151b18;
  font-weight:900;
  font-size:18px;
}

.badge.river{
  color:#fff;
  background:
    linear-gradient(135deg,#fff 35%,#d82626 36%,#d82626 58%,#fff 59%);
  color:#111;
}

  background:#15376b;
  border-color:#f1d23c;
